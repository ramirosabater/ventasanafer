<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anafer S.A. · Pedidos de agua y soda IVESS</title>
<meta name="description" content="Pedí agua y soda IVESS con entrega sin cargo en Comodoro Rivadavia, Rada Tilly, Caleta Olivia y Pico Truncado. Pagá en efectivo al recibir o online.">
<meta name="theme-color" content="#223C7E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 26'%3E%3Cpath d='M10 1C14 8 18 12 18 17a8 8 0 0 1-16 0C2 12 6 8 10 1z' fill='%23009FE3' stroke='%23223C7E' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --sea:#0F2147; --ivess:#223C7E; --ivess-2:#1A2F63; --sky:#009FE3; --glacier:#EAF5FC; --foam:#FFFFFF;
  --leaf:#2E9E4F; --sun:#FFB627; --coral:#E30613; --muted:#4A6480; --line:#CFE3F1;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--glacier);color:var(--sea);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.02;text-wrap:balance;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.1;white-space:nowrap;transition:transform .12s ease,background .12s ease}
.btn:active{transform:translateY(1px)}
.btn-blue{background:var(--ivess);color:#fff}
.btn-blue:hover{background:var(--ivess-2)}
.btn-sun{background:var(--sun);color:var(--sea)}
.btn-white{background:#fff;color:var(--ivess)}
.btn-line{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn-wa{background:#1FA855;color:#fff}
.btn-sm{padding:8px 14px;font-size:14px}
.btn-icon{width:40px;height:40px;padding:0;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ivess);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* barra superior */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{height:48px;width:auto}
@media (max-width:480px){.brand img{height:38px}}
.brand .mark{width:34px;height:42px;flex:none}
.brand .wm{display:grid;line-height:1}
.brand .wm b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;color:var(--ivess)}
.brand .wm small{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{font-weight:600;text-decoration:none;padding:8px 12px;border-radius:999px;font-size:15px;color:var(--sea)}
.nav a:hover{background:var(--glacier);color:var(--ivess)}
.cartbtn{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--ivess);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer}
.cartbtn svg{width:20px;height:20px}
.badge{min-width:22px;height:22px;border-radius:999px;background:var(--coral);color:#fff;font-size:13px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
@media (max-width:860px){.nav{display:none}.top .wa-top span{display:none}.top .wa-top{margin-left:auto;width:42px;height:42px;padding:0}}
@media (max-width:420px){.cartbtn .lbl{display:none}.brand .wm small{display:none}}

/* hero */
.hero{background:var(--ivess);color:#fff;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1fr minmax(0,470px);gap:48px;align-items:center;padding-block:52px 120px}
.hero h1{font-size:clamp(42px,6.4vw,78px);font-weight:800;margin:0 0 18px}
.hero p.lead{font-size:19px;color:#D7EAFB;max-width:36ch;margin:0 0 26px}
.perks{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.perks li{display:flex;gap:12px;align-items:center;font-weight:600;font-size:17px}
.perks svg{width:26px;height:26px;flex:none}
.waves{position:absolute;left:0;right:0;bottom:-1px;height:110px;z-index:0}
.waves svg{width:100%;height:100%;display:block}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:30px;padding-block:36px 96px}}

/* pedido rápido */
.quick{background:#fff;color:var(--sea);border-radius:28px;padding:24px;box-shadow:0 30px 60px -20px rgba(6,43,79,.55)}
.quick h2{font-size:28px;font-weight:800;margin-bottom:4px}
.quick .sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--glacier);border-radius:999px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{border:0;background:transparent;border-radius:999px;padding:10px 8px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ivess);box-shadow:0 2px 8px rgba(6,43,79,.12)}
.seg button.leaf[aria-pressed="true"]{color:var(--leaf)}
.shelf{display:flex;align-items:flex-end;gap:0;height:118px;margin:14px 0 6px;padding:0 4px;border-bottom:3px solid var(--line);overflow:hidden}
.shelf .jug{width:80px;min-width:44px;height:100px;flex:0 1 80px;margin-right:-10px;animation:drop .38s cubic-bezier(.3,1.5,.6,1) both}
.shelf .jug svg{width:100%;height:100%;display:block}
.shelf .more{font-family:var(--display);font-weight:800;font-size:26px;color:var(--ivess);padding:0 6px 26px}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;background:var(--glacier);border-radius:999px;padding:4px}
.qty button{border:0;background:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;font-weight:700;cursor:pointer;color:var(--ivess);display:grid;place-items:center;box-shadow:0 1px 4px rgba(6,43,79,.12)}
.qty span{min-width:46px;text-align:center;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.qty.sm button{width:32px;height:32px;font-size:18px}
.qty.sm span{min-width:32px;font-size:16px}
.qprice{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.qprice small{display:block;font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.quick .btn-blue{width:100%;margin-top:16px;padding:15px 20px;font-size:17px}

/* último pedido */
.again{margin-top:-64px;position:relative;z-index:2}
.again .box{background:#fff;border-radius:22px;padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 12px 30px -16px rgba(6,43,79,.35)}
.again .box p{margin:0;flex:1 1 260px}
.again .box b{font-family:var(--display)}

/* secciones */
section.block{padding-block:72px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font-size:clamp(34px,4.6vw,54px);font-weight:800;color:var(--sea)}
.sec-head p{margin:8px 0 0;color:var(--muted);max-width:56ch;font-size:17px}

/* cómo pagar */
.pay{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.payopt{border-radius:28px;padding:28px;display:grid;gap:12px;align-content:start}
.payopt.cash{background:var(--sea);color:#fff}
.payopt.online{background:#fff;border:2px solid var(--line)}
.payopt h3{font-size:30px;font-weight:800}
.payopt p{margin:0;font-size:17px}
.payopt.cash p{color:#C9DDF0}
.payopt.online p{color:var(--muted)}
.payopt .ico{width:56px;height:56px}
.payopt .tags{display:flex;gap:8px;flex-wrap:wrap}
.payopt .tags span{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--glacier);color:var(--ivess)}
.payopt.cash .tags span{background:rgba(255,255,255,.12);color:#fff}
.steps{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:40px;height:40px;border-radius:50%;background:var(--sky);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;display:grid;place-items:center}
.steps b{display:block;font-size:17px}
.steps span{color:var(--muted);font-size:15px}
@media (max-width:800px){.pay{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}

/* ofertas y combos */
.deals{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.deal{background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;border:2px solid var(--line)}
.deal .media{position:relative;background:var(--glacier)}
.deal .media .art,.deal .media>img{aspect-ratio:16/10;width:100%;object-fit:contain}
.deal .tag{position:absolute;left:14px;top:14px;background:var(--coral);color:#fff;font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px}
.deal .off{position:absolute;right:14px;top:14px;background:var(--sun);color:var(--sea);font-family:var(--display);font-weight:800;font-size:20px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;transform:rotate(10deg)}
.deal .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.deal h3{font-size:24px;font-weight:800}
.deal ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.deal li{display:flex;gap:10px;align-items:flex-start}
.deal li::before{content:"";flex:none;width:10px;height:13px;margin-top:6px;background:var(--sky);clip-path:path("M5 0C7 4 10 6 10 8.5a5 5 0 0 1-10 0C0 6 3 4 5 0z")}
.deal .desc{color:var(--muted);margin:0}
.deal .foot{margin-top:auto;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.old{color:var(--muted);text-decoration:line-through;font-weight:600;font-size:15px}
.big{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.ask{font-weight:700;color:var(--muted)}
.until{font-size:14px;color:var(--muted)}
.combo .media{display:flex;align-items:flex-end;justify-content:center;gap:0;padding:20px 20px 0;aspect-ratio:16/10;background:var(--c,var(--sky))}
.combo .media .art{aspect-ratio:auto;height:100%;flex:1;max-width:150px;background:none!important}
.combo .media .art::after{display:none}
.combo .media .art svg{width:92%;max-height:100%}
.combo .media .cimg{flex:1;max-width:46%;height:92%;align-self:center;background:#fff;border-radius:18px;overflow:hidden;margin:0 4px 12px}
.combo .media .cimg img{width:100%;height:100%;object-fit:contain}

/* catálogo */
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 8px 4px 16px}
.search:focus-within{border-color:var(--ivess)}
.search input{border:0;outline:0;background:transparent;padding:9px 4px;flex:1;min-width:0}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:15px;color:var(--sea);box-shadow:inset 0 0 0 1.5px var(--line)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.chip small{font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--sea);color:#fff;box-shadow:none}
.chip[aria-pressed="true"] small{color:#B9CDE2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.prod{background:#fff;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.prod .media{position:relative}
.prod .media .art,.prod .media img{aspect-ratio:1/1;width:100%;object-fit:contain}
.prod .media img,.deal .media img{background:#fff}
.prod .flag{position:absolute;left:10px;top:10px;background:var(--coral);color:#fff;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px}
.prod .flag.leaf{background:var(--leaf)}
.prod .flag.star{background:var(--sea)}
.prod .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .cat{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.prod .cat i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.prod h3{font-family:var(--body);font-size:17px;font-weight:700;line-height:1.25;letter-spacing:0}
.prod .note{font-size:13px;color:var(--muted)}
.prod .foot{margin-top:auto;padding-top:10px;display:grid;gap:8px}
.prod .pr{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.prod .pr.ask{font-family:var(--body);font-size:14px;font-weight:600}
.prod .row{display:flex;gap:8px;align-items:center}
.prod .row .btn-blue{flex:1}
.prod .incart{flex:1;display:flex;justify-content:space-between;align-items:center}
@media (max-width:520px){.prod h3{font-size:15px}.prod .body{padding:10px 10px 12px}.prod .row .btn{padding:9px 10px;font-size:14px}}
.empty{border:2px dashed var(--line);border-radius:20px;padding:28px;text-align:center;color:var(--muted);background:#fff}

/* arte de productos */
.art{--c:var(--sky);position:relative;display:grid;place-items:center;background:linear-gradient(180deg,#fff 0%,var(--glacier) 100%);overflow:hidden}
.art::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-28%;height:52%;background:var(--c);opacity:.16;border-radius:50% 50% 0 0/40% 40% 0 0}
.art svg{position:relative;z-index:1;width:62%;height:auto;max-height:86%}

/* sucursales */
.where{display:grid;grid-template-columns:1fr 1.4fr;gap:28px;align-items:start}
.zones{background:var(--sea);color:#fff;border-radius:28px;padding:28px;display:grid;gap:14px}
.zones h3{font-size:28px;font-weight:800}
.zones p{margin:0;color:#C9DDF0}
.zones ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.zones li{background:rgba(255,255,255,.12);padding:7px 14px;border-radius:999px;font-weight:700}
.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.branch{background:#fff;border-radius:18px;padding:16px 18px}
.branch h3{font-family:var(--body);font-size:16px;font-weight:700;letter-spacing:0;color:var(--ivess);margin-bottom:6px}
.branch ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;color:var(--sea)}
@media (max-width:820px){.where{grid-template-columns:1fr}}

/* contacto */
.contact{background:var(--ivess);color:#fff}
.contact .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;padding-block:64px}
.contact h2{font-size:clamp(36px,5vw,60px);font-weight:800}
.contact p{color:#D7EAFB;font-size:18px;max-width:42ch}
.cinfo{display:grid;gap:12px;align-content:start}
.cinfo .item{background:rgba(255,255,255,.1);border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cinfo .k{font-size:14px;color:#B8D7F3;font-weight:600}
.cinfo .v{font-size:18px;font-weight:700}
.cinfo a{text-decoration:none}
@media (max-width:780px){.contact .wrap{grid-template-columns:1fr}}
footer.foot{background:var(--sea);color:#9FB8D1;font-size:14px}
footer.foot .wrap{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-block:20px}
footer.foot a{color:#fff}

/* flotantes */
.fab-wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:50%;background:#1FA855;display:grid;place-items:center;box-shadow:0 10px 24px rgba(6,43,79,.3)}
.fab-wa svg{width:30px;height:30px}
.fab-cart{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;height:56px;border-radius:999px;background:var(--sea);color:#fff;border:0;display:flex;align-items:center;gap:12px;padding:0 10px 0 20px;font-weight:700;box-shadow:0 14px 30px rgba(6,43,79,.4);cursor:pointer;max-width:calc(100% - 110px)}
.fab-cart .go{background:var(--coral);color:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap}
.fab-cart .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--sea);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600;box-shadow:0 10px 24px rgba(6,43,79,.3);max-width:calc(100% - 32px);text-align:center;animation:pop .2s ease both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* panel lateral (carrito / checkout / admin) */
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;background:rgba(6,43,79,.5)}
.drawer .panel{width:min(540px,100%);height:100%;background:var(--glacier);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(6,43,79,.3)}
.drawer.anim .panel{animation:slide .22s ease both}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.drawer header{background:#fff;padding:16px 20px 14px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);display:grid;gap:12px}
.drawer .hrow{display:flex;align-items:center;gap:12px}
.drawer .hrow h2{font-size:26px;font-weight:800;margin-right:auto}
.x{border:0;background:var(--glacier);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;color:var(--sea);flex:none}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;list-style:none;margin:0;padding:0}
.prog li{font-size:13px;font-weight:700;color:var(--muted);border-top:4px solid var(--line);padding-top:6px}
.prog li.on{color:var(--ivess);border-color:var(--ivess)}
.prog li.done{color:var(--sea);border-color:var(--sky)}
.drawer .content{overflow:auto;padding:18px 20px;flex:1;display:grid;gap:14px;align-content:start}
.drawer .bar{background:#fff;border-top:1px solid var(--line);padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.drawer .bar .tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.drawer .bar .tot b{font-family:var(--display);font-size:28px}
.drawer .bar .btns{display:flex;gap:10px}
.drawer .bar .btns .btn{flex:1;padding:15px 18px;font-size:16px}
.drawer .bar .btns .btn-line{flex:0 0 auto}
.citem{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px}
.citem .thumb{width:60px;height:60px;border-radius:12px;overflow:hidden}
.citem .thumb .art,.citem .thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.citem .nm{font-weight:700;line-height:1.25}
.citem .sub{font-size:13px;color:var(--muted)}
.citem .side{display:grid;gap:6px;justify-items:end}
.rm{border:0;background:none;color:var(--coral);font-weight:700;font-size:13px;cursor:pointer;padding:2px 4px}
.card{background:#fff;border-radius:18px;padding:16px;display:grid;gap:12px}
.card h3{font-family:var(--body);font-size:17px;font-weight:700;letter-spacing:0}
.hint{font-size:14px;color:var(--muted);margin:0}
.field{display:grid;gap:5px}
.field label{font-size:14px;font-weight:700}
.field label small{font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid #BBD3E6;border-radius:12px;padding:11px 12px;background:#fff;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--ivess);box-shadow:0 0 0 3px rgba(34,60,126,.18)}
.field textarea{min-height:76px;resize:vertical}
.field.err input,.field.err select{border-color:var(--coral)}
.field .msg{font-size:13px;color:#C23A1C;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.opt input{margin:3px 0 0;width:20px;height:20px;accent-color:var(--ivess);flex:none}
.opt b{display:block}
.opt span{font-size:14px;color:var(--muted)}
.opt:has(input:checked){border-color:var(--ivess);background:#F5FAFE}
.opt .ic{width:36px;height:36px;flex:none;margin-left:auto}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--ivess)}
.done-hero{background:var(--sea);color:#fff;border-radius:24px;padding:24px;display:grid;gap:8px}
.done-hero h3{font-size:30px;font-weight:800}
.done-hero p{margin:0;color:#C9DDF0}
.done-hero .no{font-family:var(--display);font-weight:800;font-size:22px;color:#7FD3F7}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:700;word-break:break-word}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--glacier);border-radius:12px;padding:10px 12px}
.copyrow b{word-break:break-all}

/* admin */
.admin-pill{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:26;box-shadow:0 8px 24px rgba(6,43,79,.3)}
.sample-note{background:var(--sun);color:var(--sea);font-size:14px;font-weight:600;text-align:center;padding:8px 16px}
.adm .panel{width:min(780px,100%)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:var(--glacier);color:var(--sea);padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
.tab[aria-selected="true"]{background:var(--ivess);color:#fff}
.status{font-size:14px;color:var(--muted)}
.status.dirty{color:#B76E00;font-weight:600}
.arow{background:#fff;border-radius:14px;padding:10px;display:flex;align-items:center;gap:12px}
.arow .thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none}
.arow .thumb .art,.arow .thumb img{width:100%;height:100%;object-fit:cover}
.arow .meta{flex:1;min-width:0}
.arow .meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .meta span{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.form{background:#fff;border:2px solid var(--ivess);border-radius:16px;padding:16px;display:grid;gap:12px}
.form .ftitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.form .ftitle strong{font-family:var(--display);font-size:22px}
.danger{background:#fff;color:#C23A1C;box-shadow:inset 0 0 0 2px #C23A1C}
.danger.solid{background:#C23A1C;color:#fff;box-shadow:none}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--glacier);color:var(--muted)}
.pill.on{background:#DDF3E3;color:#1E7A3A}
.pill.exp{background:#FDE3DC;color:#B3261E}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo .pv{width:92px;height:92px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.photo .pv .art,.photo .pv img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sea)}
</style>
</head>

var cart = lsGet(LS.cart, []); if(!Array.isArray(cart)) cart = [];
function saveCart(){ lsSet(LS.cart, cart); }
function resolve(k){
  var t=k.charAt(0), id=k.slice(2);
  if(t==="p"){ var p=prodById(id); if(!p) return null; return {name:p.nombre, price:priceOf(p), prod:p, ret:!!p.retornable}; }
  if(t==="c"){ var c=comboById(id); if(!c) return null; return {name:c.titulo, price:c.precio||null, combo:c, ret:/bid[oó]n|sif[oó]n retornable/i.test(c.items||"")}; }
  return null;
}
function lines(){ return cart.map(function(it){ var r=resolve(it.k); if(!r) return null; r.k=it.k; r.qty=it.qty; return r; }).filter(Boolean); }
function cartCount(){ return lines().reduce(function(n,l){ return n+l.qty; },0); }
function totals(){ var t=0, ask=0; lines().forEach(function(l){ if(l.price) t+=l.price*l.qty; else ask++; }); return {total:t, ask:ask}; }
function qtyOf(k){ for(var i=0;i<cart.length;i++) if(cart[i].k===k) return cart[i].qty; return 0; }
function setQty(k, q){
  var f=null; cart.forEach(function(it){ if(it.k===k) f=it; });
  if(q<=0){ cart = cart.filter(function(it){ return it.k!==k; }); }
  else if(f) f.qty=q; else cart.push({k:k, qty:q});
  saveCart();
}
function add(k, n){ setQty(k, qtyOf(k)+(n||1)); toast(n>1?("Agregaste "+n+" al pedido"):"Agregado al pedido"); refreshCartUI(); }
function totalLabel(){ var tt=totals(); if(!tt.total) return "A confirmar"; return money(tt.total)+(tt.ask?" + a confirmar":""); }
function refreshCartUI(){
  var n=cartCount();
  $$("[data-cartcount]").forEach(function(b){ b.textContent=n; });
  var f=$(".fab-cart"); if(f){ f.hidden=!n||!!ui.drawer; var t=$(".fab-cart .t"); if(t) t.textContent=n+" producto"+(n===1?"":"s")+" · "+totalLabel(); }
  renderGrid();
  if(ui.drawer==="checkout") renderDrawer();
}

document.addEventListener("click", function(ev){
  var t=ev.target.closest("button, a"); if(!t) return;
  var d=t.dataset;
  if(d.add){ add(d.add); return; }
  if(d.inc){ setQty(d.inc, qtyOf(d.inc)+1); ui.keepScroll=true; refreshCartUI(); return; }
  if(d.dec){ setQty(d.dec, qtyOf(d.dec)-1); ui.keepScroll=true; refreshCartUI(); if(ui.drawer==="checkout"&&!cartCount()) render(); return; }
  if(d.rm){ setQty(d.rm, 0); ui.keepScroll=true; refreshCartUI(); if(!cartCount()) render(); return; }
  if(d.cat){ ui.cat=d.cat; ui.limit=24; renderCats(); renderGrid(); return; }
  if(d.copy){ copyText(d.copy); return; }
  if(d.q){
    var q=ui.quick, before=Math.min(q.qty,6);
    if(d.q==="size"){ q.size=d.v; renderQuick(); }
    if(d.q==="sodio"){ q.sodio=d.v==="1"; renderQuick(); }
    if(d.q==="plus"){ q.qty=Math.min(99,q.qty+1); renderQuick(before); }
    if(d.q==="minus"){ q.qty=Math.max(1,q.qty-1); renderQuick(); }
    if(d.q==="add"){ var p=quickProd(); if(p) add("p:"+p.id, q.qty); }
    return;
  }
  var a=d.act; if(!a) return;
  if(a==="open"){ openCheckout(); }
  if(a==="close"){ ui.drawer=null; if(ui.step==="listo") ui.step="cart"; ui.errors={}; render(); }
  if(a==="more"){ ui.limit+=24; renderGrid(); }
  if(a==="next"){
    if(ui.step==="cart"){ ui.step="entrega"; ui.errors={}; renderDrawer(); return; }
    if(ui.step==="entrega"){ if(validate("entrega")){ ui.step="pago"; ui.errors={}; } else ui.focusErr=true; renderDrawer(); return; }
  }
  if(a==="back"){ ui.step = ui.step==="pago"?"entrega":"cart"; ui.errors={}; renderDrawer(); }
  if(a==="send"){ if(!validate("pago")){ ui.keepScroll=true; renderDrawer(); return; } sendOrder(); }
  if(a==="repeat"){
    var last=pedidos()[0]; if(!last) return; var n=0;
    last.lines.forEach(function(l){ if(resolve(l.k)){ setQty(l.k, qtyOf(l.k)+l.qty); n++; } });
    if(n){ toast("Agregamos tu último pedido"); openCheckout(); } else toast("Esos productos ya no están disponibles");
  }
  if(a==="admin"){ ui.drawer="admin"; ui.anim=true; render(); ui.anim=false; }
});

  return dirty() ? '<span class="status dirty">Tenés cambios sin descargar. Tocá “Descargar index.html” y subí el archivo a tu hosting.</span>' : '<span class="status">Sin cambios pendientes.</span>';
}
function renderAdmin(){
  var box=$("#drawer"); if(!box) return;
  var tabs=[["productos","Productos"],["ofertas","Ofertas"],["combos","Combos"],["pagos","Pagos y entrega"],["datos","Datos del negocio"]];
  var h='<div class="drawer adm'+(ui.anim?' anim':'')+'" role="dialog" aria-modal="true" aria-label="Administrar"><div class="panel"><header>'+
    '<div class="hrow"><h2>Administrar</h2><button class="btn btn-blue btn-sm" data-adm="download"'+(dirty()?'':' disabled')+'>Descargar index.html</button>'+
    (dirty()?'<button class="btn btn-line btn-sm" data-adm="discard">Descartar</button>':'')+'<button class="x" data-adm="close" aria-label="Cerrar">×</button></div>'+
    '<div class="tabs" role="tablist">'+tabs.map(function(t){ return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'">'+t[1]+'</button>'; }).join("")+'</div>'+
    '<div id="status">'+statusLine()+'</div></header><div class="content">';
  if(ui.tab==="productos") h+=admProductos();
  if(ui.tab==="ofertas") h+=admOfertas();
  if(ui.tab==="combos") h+=admCombos();
  if(ui.tab==="pagos") h+=admPagos();
  if(ui.tab==="datos") h+=admDatos();
  h+='</div></div></div>';
  var sc=$(".adm .content"), top=sc?sc.scrollTop:0;
  box.innerHTML=h;
  var sc2=$(".adm .content"); if(sc2) sc2.scrollTop=top;
}
function refreshStatus(){ saveDraft(); var s=$("#status"); if(s) s.innerHTML=statusLine(); var b=$('[data-adm="download"]'); if(b) b.disabled=!dirty(); }
function F(label, c, id, k, val, type, opts){
  var fid="f-"+c+"-"+id+"-"+k, inp;
  if(type==="textarea") inp='<textarea id="'+fid+'" data-c="'+c+'" data-id="'+id+'" data-k="'+k+'">'+esc(val)+'</textarea>';
  else if(type==="lines") inp='<textarea id="'+fid+'" data-c="'+c+'" data-id="'+id+'" data-k="'+k+'" data-t="lines">'+esc((val||[]).join("\n"))+'</textarea>';
  else if(type==="select") inp='<select id="'+fid+'" data-c="'+c+'" data-id="'+id+'" data-k="'+k+'">'+opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'; }).join("")+'</select>';
  else inp='<input id="'+fid+'" type="'+(type==="number"?"number":(type||"text"))+'" '+(type==="number"?'inputmode="numeric" min="0" step="1"':'')+' data-c="'+c+'" data-id="'+id+'" data-k="'+k+'"'+(type==="number"?' data-t="num"':'')+' value="'+esc(val==null?"":val)+'">';
  return '<div class="field'+((type==="textarea"||type==="lines")?' full':'')+'"><label for="'+fid+'">'+label+'</label>'+inp+'</div>';
}
function CB(label,c,id,k,val){ var fid="f-"+c+"-"+id+"-"+k; return '<label class="check" for="'+fid+'"><input type="checkbox" id="'+fid+'" data-c="'+c+'" data-id="'+id+'" data-k="'+k+'"'+(val?' checked':'')+'>'+label+'</label>'; }
function delBtns(c,id){ var k=c+":"+id; if(ui.confirmDel===k) return '<span style="font-weight:600">¿Eliminar?</span><button class="btn btn-sm danger solid" data-adm="delyes" data-c="'+c+'" data-id="'+id+'">Sí, eliminar</button><button class="btn btn-sm btn-line" data-adm="delno">No</button>'; return '<button class="btn btn-sm danger" data-adm="del" data-c="'+c+'" data-id="'+id+'">Eliminar</button>'; }
function swatches(c,id,val){ return '<div class="field full"><label>Color</label><div class="swatches">'+Object.keys(COLORS).map(function(k){ return '<button class="sw" title="'+COLOR_NAMES[k]+'" aria-label="'+COLOR_NAMES[k]+'" aria-pressed="'+(val===k)+'" style="background:'+COLORS[k]+'" data-adm="color" data-c="'+c+'" data-id="'+id+'" data-v="'+k+'"></button>'; }).join("")+'</div></div>'; }

function bulkBox(){
  var b=ui.bulk, n=parseFloat(String(b.pct).replace(",","."));
  var cats=[["all","Todas las categorías"]].concat(state.categorias.map(function(c){ return [c.id,c.nombre]; }));
  var cnt=state.productos.filter(function(p){ return p.precio && (b.cat==="all"||p.cat===b.cat); }).length;
  var h='<div class="card"><h3>Aumento masivo de precios</h3><div class="fgrid">'+
    '<div class="field"><label for="bulkPct">Porcentaje (ej. 10 o -5)</label><input id="bulkPct" type="number" step="0.1" inputmode="decimal" value="'+esc(b.pct)+'"></div>'+
    '<div class="field"><label for="bulkCat">Aplicar a</label><select id="bulkCat">'+cats.map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===b.cat?' selected':'')+'>'+esc(o[1])+'</option>'; }).join("")+'</select></div>'+
    '<div class="field"><label for="bulkRound">Redondear a</label><select id="bulkRound">'+[["1","Sin redondeo"],["10","$ 10"],["50","$ 50"],["100","$ 100"]].map(function(o){ return '<option value="'+o[0]+'"'+(o[0]===b.round?' selected':'')+'>'+o[1]+'</option>'; }).join("")+'</select></div></div>'+
    '<p class="hint">Cambia solo los productos que ya tienen precio ('+cnt+'), también sus ofertas y, si elegís todas las categorías, los combos.</p>';
  if(b.confirm && n) h+='<div class="acts" style="justify-content:flex-start;align-items:center"><b>¿'+(n>0?'Aumentar':'Bajar')+' '+Math.abs(n)+'% los precios?</b><button class="btn btn-sm danger solid" data-adm="bulkyes">Sí, aplicar</button><button class="btn btn-sm btn-line" data-adm="bulkno">Cancelar</button></div>';
  else h+='<div><button class="btn btn-sm btn-blue" data-adm="bulkask"'+(n&&cnt?'':' disabled')+'>Aplicar '+(n?(n>0?'+':'')+n+'%':'aumento')+'</button></div>';
  return h+'</div>';
}
function applyBulk(){
  var b=ui.bulk, n=parseFloat(String(b.pct).replace(",",".")); if(!n) return;
  var f=1+n/100, r=parseInt(b.round,10)||1;
  function adj(v){ return v?Math.max(0,Math.round(v*f/r)*r):v; }
  state.productos.forEach(function(p){ if(p.precio && (b.cat==="all"||p.cat===b.cat)) p.precio=adj(p.precio); });
  state.ofertas.forEach(function(o){ var p=prodById(o.prodId); if(p && (b.cat==="all"||p.cat===b.cat)){ o.antes=adj(o.antes); o.ahora=adj(o.ahora); } });
  if(b.cat==="all") state.combos.forEach(function(c){ c.antes=adj(c.antes); c.precio=adj(c.precio); });
  ui.bulk={pct:"",cat:b.cat,round:b.round,confirm:false};
}

function resizeImage(file, max, cb){
  var r=new FileReader();
  r.onload=function(){ var img=new Image(); img.onload=function(){
    var s=Math.min(1, max/Math.max(img.width,img.height)), w=Math.round(img.width*s), h=Math.round(img.height*s);
    var cv=document.createElement("canvas"); cv.width=w; cv.height=h; var x=cv.getContext("2d"); x.drawImage(img,0,0,w,h);
    var out=cv.toDataURL("image/webp",0.82); if(out.indexOf("image/webp")<0) out=cv.toDataURL("image/jpeg",0.84); cb(out);
  }; img.src=r.result; };
  r.readAsDataURL(file);
}
function download(){
  var keep={}; state.productos.forEach(function(p){ if(p.foto && p.foto.indexOf("img:")===0){ var k=p.foto.slice(4); if(IMGS[k]) keep[k]=IMGS[k]; } }); state.combos.forEach(function(c){ String(c.ilus||"").split(",").forEach(function(t){ t=t.trim(); if(t.indexOf("img:")===0 && IMGS[t.slice(4)]) keep[t.slice(4)]=IMGS[t.slice(4)]; }); });
  IMGS=keep;
  var json=JSON.stringify(state,null,1).replace(/<\//g,"<\\/");
  var app=document.getElementById("an-app").textContent;
  var html="<!doctype html>\n<html lang=\"es\">\n<head>"+HEAD_HTML+"</head>\n<body>\n<div id=\"root\"></div>\n"+
    "<script type=\"application/json\" id=\"an-data\">"+json+SC+"\n"+
    "<script type=\"application/json\" id=\"an-img\">"+JSON.stringify(IMGS).replace(/<\//g,"<\\/")+SC+"\n"+
    "<script id=\"an-app\">"+app+SC+"\n</body>\n</html>\n";
  var blob=new Blob([html],{type:"text/html"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="index.html"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
  saved=JSON.stringify(state); savedImgs=JSON.stringify(IMGS); lsDel(LS.draft); ui.msg="Descargado. Subí el index.html a tu hosting para publicar los cambios.";
  renderAdmin();
}
document.addEventListener("click", function(ev){
  if(!ui.canEdit) return;
  var t=ev.target.closest("[data-adm],[data-tab]"); if(!t) return;
  var d=t.dataset;
  if(d.tab){ ui.tab=d.tab; ui.editing=null; ui.confirmDel=null; renderAdmin(); return; }
  var a=d.adm; ui.msg="";
  if(a==="close"){ ui.drawer=null; render(); return; }
  if(a==="download"){ download(); return; }
  if(a==="discard"){ var d0=document.getElementById("an-data").textContent; state=JSON.parse(d0); IMGS=JSON.parse(document.getElementById("an-img").textContent||"{}"); saved=JSON.stringify(state); savedImgs=JSON.stringify(IMGS); lsDel(LS.draft); render(); return; }
  if(a==="edit"){ ui.editing=d.c+":"+d.id; ui.confirmDel=null; renderAdmin(); return; }
  if(a==="done"){ ui.editing=null; ui.confirmDel=null; renderAdmin(); return; }
  if(a==="del"){ ui.confirmDel=d.c+":"+d.id; renderAdmin(); return; }
  if(a==="delno"){ ui.confirmDel=null; renderAdmin(); return; }
  if(a==="delyes"){ state[d.c]=state[d.c].filter(function(x){ return x.id!==d.id; }); if(d.c==="productos") state.ofertas=state.ofertas.filter(function(o){ return o.prodId!==d.id; }); ui.editing=null; ui.confirmDel=null; refreshStatus(); renderAdmin(); return; }
  if(a==="addprod"){ var p={id:uid("p"),nombre:"Producto nuevo",cat:state.categorias[0].id,desc:"",precio:null,foto:"",ilus:"bidon",tinte:"",retornable:false,destacado:false}; state.productos.unshift(p); ui.editing="productos:"+p.id; refreshStatus(); renderAdmin(); return; }
  if(a==="addof"){ var o={id:uid("o"),prodId:state.productos[0].id,antes:null,ahora:null,etiqueta:"Oferta",hasta:"",activa:true}; state.ofertas.unshift(o); ui.editing="ofertas:"+o.id; refreshStatus(); renderAdmin(); return; }
  if(a==="addcombo"){ var c={id:uid("c"),titulo:"Combo nuevo",desc:"",items:"",antes:null,precio:null,color:"sky",ilus:"bidon",activa:true}; state.combos.unshift(c); ui.editing="combos:"+c.id; refreshStatus(); renderAdmin(); return; }
  if(a==="color"){ var it=getItem(d.c,d.id); if(it){ it.color=d.v; refreshStatus(); renderAdmin(); } return; }
  if(a==="nophoto"){ var pp=prodById(d.id); if(pp){ pp.foto=""; refreshStatus(); renderAdmin(); } return; }
  if(a==="nologo"){ state.settings.logo=""; refreshStatus(); renderAdmin(); return; }
  if(a==="bulkask"){ ui.bulk.confirm=true; renderAdmin(); return; }
  if(a==="bulkno"){ ui.bulk.confirm=false; renderAdmin(); return; }
  if(a==="bulkyes"){ applyBulk(); refreshStatus(); renderAdmin(); return; }
});
document.addEventListener("input", function(ev){
  if(!ui.canEdit) return;
  var t=ev.target, d=t.dataset;
  if(t.id==="bulkPct"){ ui.bulk.pct=t.value; ui.bulk.confirm=false; var b=$('[data-adm="bulkask"]'); var n=parseFloat(t.value); if(b){ b.disabled=!n; b.textContent="Aplicar "+(n?(n>0?"+":"")+n+"%":"aumento"); } return; }
  if(t.id==="sucs"){ state.sucursales=t.value.split("\n").map(function(l){ var p=l.split("|"); return p.length>1?{zona:p[0].trim(),dir:p.slice(1).join("|").trim()}:null; }).filter(function(x){ return x&&x.zona&&x.dir; }); refreshStatus(); return; }
  if(!d.c) return;
  var it=getItem(d.c,d.id); if(!it) return;
  var v;
  if(t.type==="checkbox") v=t.checked;
  else if(d.t==="num") v=t.value===""?null:Math.max(0,Math.round(Number(t.value)));
  else if(d.t==="lines") v=t.value.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
  else v=t.value;
  it[d.k]=v; refreshStatus();
  if(t.type==="checkbox" || t.tagName==="SELECT"){ renderAdmin(); }
});
document.addEventListener("change", function(ev){
  if(!ui.canEdit) return;
  var t=ev.target;
  if(t.id==="bulkCat"){ ui.bulk.cat=t.value; ui.bulk.confirm=false; renderAdmin(); return; }
  if(t.id==="bulkRound"){ ui.bulk.round=t.value; return; }
  if(t.dataset.photo && t.files && t.files[0]){ var id=t.dataset.photo; resizeImage(t.files[0], 700, function(url){ var k="f"+id; IMGS[k]=url; var p=prodById(id); if(p) p.foto="img:"+k; refreshStatus(); renderAdmin(); }); return; }
  if(t.dataset.logo && t.files && t.files[0]){ resizeImage(t.files[0], 480, function(url){ state.settings.logo=url; refreshStatus(); renderAdmin(); }); return; }
});
